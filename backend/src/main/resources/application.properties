# Cổng server chạy Backend
server.port=8080

# Cấu hình kết nối MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/easysport?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ========================================================
# Cấu hình Cổng thanh toán SePay Sandbox
# Nhận từ biến môi trường hệ điều hành:
#   SEPAY_MERCHANT_ID, SEPAY_SECRET_KEY, SEPAY_IPN_SECRET, APP_PUBLIC_URL
# ========================================================
sepay.merchant-id=${SEPAY_MERCHANT_ID:}
sepay.secret-key=${SEPAY_SECRET_KEY:}
sepay.ipn-secret=${SEPAY_IPN_SECRET:}
sepay.app-public-url=${APP_PUBLIC_URL:http://localhost:8080}
sepay.checkout-url=https://pay-sandbox.sepay.vn/v1/checkout/init
sepay.query-api-url=https://pgapi-sandbox.sepay.vn

# ========================================================
# Cấu hình Phân ca & Dữ liệu mẫu Demo
# APP_SEED_DEMO mặc định là false để không ghi đè dữ liệu trên Railway
# APP_SHIFT_ENFORCE_TIME_WINDOW mặc định true để kiểm soát ca trực thực tế
# ========================================================
app.seed-demo=${APP_SEED_DEMO:false}
app.shift.enforce-time-window=${APP_SHIFT_ENFORCE_TIME_WINDOW:true}

# ========================================================
# Chính sách Hủy / Hoãn / Hoàn tiền Lịch cố định & Ví EasySport
# Các ngưỡng chưa chốt để trống (null) -> đưa vào hàng chờ Owner duyệt,
# không tự áp phạt, tỷ lệ hoàn hay hoàn 100%.
# ========================================================
easysport.policy.early-cancel-min-hours=${POLICY_EARLY_CANCEL_MIN_HOURS:168}
easysport.policy.near-start-max-hours=${POLICY_NEAR_START_MAX_HOURS:}
easysport.policy.excessive-cancel-limit=${POLICY_EXCESSIVE_CANCEL_LIMIT:}
easysport.policy.excessive-cancel-window-days=${POLICY_EXCESSIVE_CANCEL_WINDOW_DAYS:}
easysport.policy.late-cancel-refund-percent=${POLICY_LATE_CANCEL_REFUND_PERCENT:}
easysport.policy.excessive-cancel-refund-percent=${POLICY_EXCESSIVE_CANCEL_REFUND_PERCENT:}
easysport.policy.reschedule-max-weeks=${POLICY_RESCHEDULE_MAX_WEEKS:16}

